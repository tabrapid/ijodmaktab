# Mahalliy ishlab chiqish uchun PostgreSQL.
# Ishga tushirish: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ijod
      POSTGRES_PASSWORD: ijod
      POSTGRES_DB: ijod
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ijod -d ijod']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
